name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  verify:
    name: verify (typecheck / test / build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.10.0'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

  publish:
    name: publish (approval-gated)
    needs: verify
    runs-on: ubuntu-latest
    # The `release` environment pauses this job until a required
    # reviewer approves the run in the GitHub Actions UI. Configure it
    # at: Settings → Environments → release → Required reviewers.
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.10.0'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # npm Trusted Publishing needs npm >= 11.5.1. Pin to the latest npm
      # before publish so the version is explicit regardless of the bundled one.
      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@latest

      - name: Publish to npm (Trusted Publishing)
        run: npm publish --access public --provenance

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Published to npm: https://www.npmjs.com/package/@lithiumdigital/cauri-dapp-sdk/v/${{ github.ref_name }}

            See [CHANGELOG.md](./CHANGELOG.md) for full release notes.
